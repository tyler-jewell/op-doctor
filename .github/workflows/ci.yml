name: ci
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  title-lint:
    if: github.event_name == 'pull_request'
    uses: tyler-jewell/shared-config/.github/workflows/pr-title.yml@v1
  secrets-scan:
    uses: tyler-jewell/shared-config/.github/workflows/secrets-scan.yml@v1
    permissions:
      contents: read
  # Runner picker: prefers the self-hosted Mac Studio (when online, idle and the event is a trusted
  # same-repo one), else the fallback label. Fork PRs never reach the Studio. See shared-config docs/RUNNERS.md.
  # Fallback is macos-latest (free on public repos) so the macOS leg always runs on macOS.
  pick:
    uses: tyler-jewell/shared-config/.github/workflows/select-runner.yml@v1
    permissions:
      contents: read
    with:
      fallback: macos-latest
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
  # macOS leg: Studio (arm64) when available, else hosted macos-latest.
  test-macos:
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          for f in bin/op-doctor contrib/pre-commit-op-lint tests/run.sh tests/fixtures/op; do bash -n "$f"; done
      - name: Tests
        run: bash tests/run.sh
      - name: Dogfood (offline lint of this repo)
        run: bin/op-doctor lint
  # Linux leg: always hosted, so Linux portability is always proven (never on the Studio).
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          for f in bin/op-doctor contrib/pre-commit-op-lint tests/run.sh tests/fixtures/op; do bash -n "$f"; done
      - name: Tests
        run: bash tests/run.sh
      - name: Dogfood (offline lint of this repo)
        run: bin/op-doctor lint

  # Plain gate jobs so the required status-check contexts are exactly `ci` and `pr-title`.
  pr-title:
    if: always()
    needs: [title-lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          R: ${{ needs.title-lint.result }}
        run: '[ "$R" = success ] || [ "$R" = skipped ]'
  ci:
    if: always()
    needs: [pick, secrets-scan, test-macos, test-linux]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || { echo "failed: $RESULTS"; exit 1; }; done
