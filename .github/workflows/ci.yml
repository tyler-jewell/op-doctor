name: ci
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  title-lint:
    if: github.event_name == 'pull_request'
    uses: tyler-jewell/shared-config/.github/workflows/pr-title.yml@v1
  secrets-scan:
    uses: tyler-jewell/shared-config/.github/workflows/secrets-scan.yml@v1
    permissions:
      contents: read
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          for f in bin/op-doctor contrib/pre-commit-op-lint tests/run.sh tests/fixtures/op; do bash -n "$f"; done
      - name: Tests
        run: bash tests/run.sh
      - name: Dogfood (offline lint of this repo)
        run: bin/op-doctor lint

  # Plain gate jobs so the required status-check contexts are exactly `ci` and `pr-title`.
  pr-title:
    if: always()
    needs: [title-lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          R: ${{ needs.title-lint.result }}
        run: '[ "$R" = success ] || [ "$R" = skipped ]'
  ci:
    if: always()
    needs: [secrets-scan, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || { echo "failed: $RESULTS"; exit 1; }; done
