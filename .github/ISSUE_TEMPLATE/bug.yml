name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the exact command and output. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "op-doctor --version, op --version, OS" }
  - type: markdown
    attributes: { value: "Never paste secret values, tokens, or real vault/item names. Redact them." }
